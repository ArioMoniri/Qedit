name: Qedit
options:
  bundleIdPrefix: com.ariomoniri.Qedit
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    DEVELOPMENT_TEAM: FF68N39FU5
    # Local/offline builds use ad-hoc ("Sign to Run Locally"). Release/notarization
    # overrides CODE_SIGN_IDENTITY to "Developer ID Application" at archive time.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "YES"
    ENABLE_HARDENED_RUNTIME: "NO"
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ALWAYS_SEARCH_USER_PATHS: "NO"
    CLANG_ENABLE_MODULES: "YES"
    SWIFT_EMIT_LOC_STRINGS: "YES"
    GCC_WARN_UNUSED_VARIABLE: "YES"

targets:
  # ── Host application: editor (Module B), manager (Module C), onboarding, hotkey ──
  Qedit:
    type: application
    platform: macOS
    sources:
      - path: Sources/Qedit
        excludes:
          - "Support/Info.plist"
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ariomoniri.Qedit
        PRODUCT_NAME: Qedit
        INFOPLIST_FILE: Sources/Qedit/Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Qedit.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        COMBINE_HIDPI_IMAGES: "YES"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    dependencies:
      - target: QuickLookExtension
        embed: true
      - target: QuickActionExtension
        embed: true

  # ── Module A: Quick Look preview extension (read step, non-system UTIs only) ──
  QuickLookExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/QuickLookExtension
        excludes:
          - "Info.plist"
          - "Resources/web"
      - path: Sources/QuickLookExtension/Resources/web
        type: folder
        buildPhase: resources
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ariomoniri.Qedit.QuickLook
        PRODUCT_NAME: QeditQuickLook
        INFOPLIST_FILE: Sources/QuickLookExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/QuickLookExtension.entitlements
    dependencies:
      - sdk: WebKit.framework
      - sdk: Quartz.framework

  # ── Module B entry: Finder Quick Action / Service (hands file URL to host app) ──
  QuickActionExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/QuickActionExtension
        excludes:
          - "Info.plist"
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ariomoniri.Qedit.QuickAction
        PRODUCT_NAME: QeditQuickAction
        INFOPLIST_FILE: Sources/QuickActionExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/QuickActionExtension.entitlements

schemes:
  Qedit:
    build:
      targets:
        Qedit: all
      parallelizeBuild: true
      buildImplicitDependencies: true
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
