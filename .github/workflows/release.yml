name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

# Run JS actions on Node 24 (clears the Node 20 deprecation warning, incl. setup-xcode).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PWD="$(uuidgen)"

          python3 -c "import base64,os;open('$CERT_PATH','wb').write(base64.b64decode(os.environ['APPLE_CERTIFICATE']))"

          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"          # no auto-lock during the build
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 \
            -T /usr/bin/codesign -T /usr/bin/security -k "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN" >/dev/null
          echo "Signing identities visible on the default search list:"
          security find-identity -v -p codesigning

      - name: Build, sign, package DMG
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}" ./scripts/build_release.sh

      - name: Notarize and staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./scripts/notarize.sh dist/Qedit.dmg

      - name: Sign update and generate Sparkle appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          SPARKLE_VER=2.9.2
          curl -fsSL -o sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VER}/Sparkle-${SPARKLE_VER}.tar.xz"
          mkdir -p sparkle && tar -xf sparkle.tar.xz -C sparkle

          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > ed_priv
          SIG=$(./sparkle/bin/sign_update dist/Qedit.dmg --ed-key-file ed_priv)
          rm -f ed_priv
          echo "Update signature: $SIG"

          DMG_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/Qedit.dmg"
          PUBDATE=$(LC_ALL=C date -u "+%a, %d %b %Y %H:%M:%S +0000")
          cat > dist/appcast.xml <<XML
          <?xml version="1.0" standalone="yes"?>
          <rss xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" version="2.0">
            <channel>
              <title>Qedit</title>
              <item>
                <title>Version ${VERSION}</title>
                <link>https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}</link>
                <sparkle:version>${VERSION}</sparkle:version>
                <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>
                <pubDate>${PUBDATE}</pubDate>
                <enclosure url="${DMG_URL}" type="application/octet-stream" ${SIG} />
              </item>
            </channel>
          </rss>
          XML
          echo "--- appcast.xml ---"; cat dist/appcast.xml

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/Qedit.dmg dist/appcast.xml --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/Qedit.dmg dist/appcast.xml \
              --repo "$GITHUB_REPOSITORY" \
              --title "Qedit $TAG" \
              --generate-notes
          fi

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: Qedit-dmg
          path: dist/Qedit.dmg
          if-no-files-found: ignore
