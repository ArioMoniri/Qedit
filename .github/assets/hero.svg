<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 240" width="820" height="240" role="img" aria-label="Qedit — find and edit any file without changing its format">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1428"/>
      <stop offset="1" stop-color="#0a1020"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b9bff"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <clipPath id="card"><rect width="820" height="240" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="820" height="240" fill="url(#bg)"/>
    <circle cx="700" cy="20" r="180" fill="#16245096" />
    <circle cx="120" cy="220" r="150" fill="#13204a80" />

    <!-- Wordmark -->
    <text x="48" y="104" font-family="-apple-system, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="800" fill="#ffffff">Qedit</text>
    <rect x="50" y="120" width="0" height="6" rx="3" fill="url(#accent)">
      <animate attributeName="width" values="0;150;150" keyTimes="0;0.5;1" dur="2.6s" begin="0s" fill="freeze" repeatCount="1"/>
    </rect>

    <text x="50" y="158" font-family="-apple-system, SF Pro Text, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#aebfe0">Find &amp; edit any file — PDFs included —</text>
    <text x="50" y="184" font-family="-apple-system, SF Pro Text, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#aebfe0">without ever changing its format.</text>

    <!-- macOS chip -->
    <g transform="translate(50,202)">
      <rect width="150" height="26" rx="13" fill="#1c2c55"/>
      <text x="16" y="18" font-family="-apple-system, SF Pro Text, Segoe UI, sans-serif" font-size="13" fill="#9fb6ea">macOS · SwiftUI · PDFKit</text>
    </g>

    <!-- Scene: a document being scanned -->
    <g transform="translate(548,44)">
      <rect x="0" y="0" width="176" height="152" rx="14" fill="#f4f7ff"/>
      <rect x="0" y="0" width="176" height="152" rx="14" fill="none" stroke="#dbe4f7" stroke-width="1"/>

      <!-- text lines -->
      <rect x="22" y="26" width="120" height="9" rx="4.5" fill="#c5d1ea"/>
      <rect x="22" y="50" width="132" height="9" rx="4.5" fill="#c5d1ea"/>
      <rect x="22" y="74" width="96"  height="9" rx="4.5" fill="#c5d1ea"/>
      <rect x="22" y="98" width="118" height="9" rx="4.5" fill="#c5d1ea"/>
      <rect x="22" y="122" width="74" height="9" rx="4.5" fill="#c5d1ea"/>

      <!-- highlight sweeping in as the lens passes -->
      <rect x="20" y="24" width="124" height="13" rx="5" fill="#ffd23f" opacity="0">
        <animate attributeName="opacity" values="0;0;0.8;0.8" keyTimes="0;0.12;0.2;1" dur="3s" repeatCount="indefinite"/>
      </rect>
      <rect x="20" y="48" width="136" height="13" rx="5" fill="#ffd23f" opacity="0">
        <animate attributeName="opacity" values="0;0;0.8;0.8" keyTimes="0;0.32;0.4;1" dur="3s" repeatCount="indefinite"/>
      </rect>
      <rect x="20" y="72" width="100" height="13" rx="5" fill="#ffd23f" opacity="0">
        <animate attributeName="opacity" values="0;0;0.8;0.8" keyTimes="0;0.52;0.6;1" dur="3s" repeatCount="indefinite"/>
      </rect>

      <!-- magnifier scanning down the page -->
      <g>
        <animateTransform attributeName="transform" type="translate"
          values="0,0; 0,72; 0,0" keyTimes="0;0.55;1" dur="3s" repeatCount="indefinite" calcMode="spline"
          keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
        <circle cx="150" cy="34" r="22" fill="#5b9bff" fill-opacity="0.18" stroke="url(#accent)" stroke-width="6"/>
        <line x1="166" y1="50" x2="182" y2="66" stroke="url(#accent)" stroke-width="7" stroke-linecap="round"/>
      </g>
    </g>

    <!-- "saved in place" pulse -->
    <g transform="translate(548,206)">
      <rect width="176" height="24" rx="12" fill="#10331f">
        <animate attributeName="fill" values="#10331f;#155233;#10331f" dur="3s" repeatCount="indefinite"/>
      </rect>
      <circle cx="16" cy="12" r="4" fill="#34d27b"/>
      <text x="28" y="16" font-family="-apple-system, SF Pro Text, Segoe UI, sans-serif" font-size="12" fill="#8ff0bb">saved in place · stays a .pdf</text>
    </g>
  </g>
</svg>
